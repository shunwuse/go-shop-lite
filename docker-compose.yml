services:
  product:
    build:
      context: .
      dockerfile: ./services/product/Dockerfile
    ports: ["50052:50052"]
    environment:
      OTEL_ADDR: jaeger:4317
  order:
    build:
      context: .
      dockerfile: ./services/order/Dockerfile
    ports: ["50051:50051"]
    environment:
      PRODUCT_ADDR: product:50052
      NATS_ADDR: nats:4222
      OTEL_ADDR: jaeger:4317
    depends_on: [product]
  user:
    build:
      context: .
      dockerfile: ./services/user/Dockerfile
    ports: ["50053:50053"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: shop
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  nats:
    image: nats:latest
    command: ["-js"]
    ports: ["4222:4222"]
    volumes: [natsdata:/data]
  notify:
    build:
      context: .
      dockerfile: ./services/notify/Dockerfile
    environment:
      NATS_ADDR: nats:4222
    depends_on: [nats, order]
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports: ["16686:16686", "4317:4317", "4318:4318"]

volumes:
  pgdata: {}
  natsdata: {}
