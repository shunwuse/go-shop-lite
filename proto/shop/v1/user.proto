syntax = "proto3";

package shop.v1;

option go_package = "example.com/shop/proto/gen/shop/v1;shopv1";

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

message GetUserRequest { string user_id = 1; }

message GetUserResponse {
  string user_id = 1;
  string name    = 2;
}
