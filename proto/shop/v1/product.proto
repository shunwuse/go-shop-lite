syntax = "proto3";

package shop.v1;

option go_package = "example.com/shop/proto/gen/shop/v1;shopv1";

service ProductService {
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc DeductStock(DeductStockRequest) returns (DeductStockResponse);
  rpc RestoreStock(RestoreStockRequest) returns (RestoreStockResponse);
}

message GetProductRequest { string product_id = 1; }

message GetProductResponse {
  string product_id = 1;
  string name       = 2;
  int32  stock      = 3;
  // Added after the contract froze: old clients compiled without this
  // field keep working, they just never see it. Numbers are never reused.
  string category = 4;
}

message DeductStockRequest {
  string product_id      = 1;
  int32  qty             = 2;
  string idempotency_key = 3;
}

message DeductStockResponse {
  string product_id = 1;
  int32 remaining = 2;
}

message RestoreStockRequest {
  string product_id = 1;
  int32 qty = 2;
  string idempotency_key = 3;
}

message RestoreStockResponse {
  string product_id = 1;
  int32 remaining = 2;
}
